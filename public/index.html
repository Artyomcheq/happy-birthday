<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  
    <!-- Основной заголовок и описание страницы -->
    <title>Тебе Послание! ✨ Интерактивная праздничная открытка</title>
    <meta name="description" content="Особенное праздничное поздравление, созданное с любовью. Открой, чтобы посмотреть сюрприз! 🎁🎉" />
    <meta name="keywords" content="поздравление, открытка, праздник, сюрприз, онлайн открытка" />
    <meta name="theme-color" content="#FFB6C1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
    <!-- Open Graph / Facebook / Telegram / WhatsApp / VK -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Вам пришла праздничная открытка! 💌" />
    <meta property="og:description" content="Кто-то приготовил для вас особенное поздравление. Нажмите, чтобы открыть сюрприз! ✨" />
    
    <!-- Замените на прямую ссылку с Vercel после деплоя (например, https://my-card.vercel.app) -->
    <meta property="og:url" content="https://your-project.vercel.app" />
    
    <!-- Картинка-превью при отправке ссылки в мессенджеры -->
    <!-- Положите красивое изображение (например, og-image.jpg) в папку public -->
    <meta property="og:image" content="https://your-project.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Вам пришла праздничная открытка! 💌" />
    <meta name="twitter:description" content="Кто-то приготовил для вас особенное поздравление. Нажмите, чтобы открыть! ✨" />
    <meta name="twitter:image" content="https://your-project.vercel.app/og-image.jpg" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
